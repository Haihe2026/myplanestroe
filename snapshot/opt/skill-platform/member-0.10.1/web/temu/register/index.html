<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Temu商家生图skill · 开通账户</title>
  <link rel="icon" href="/membership/temu/icon.png">
  <link rel="stylesheet" href="register.css?v=0.10.1">
  <script src="register.js?v=0.10.1" defer></script>
</head>
<body>
  <header><a href="/membership/temu/"><img src="/membership/temu/icon.png" width="32" height="32" alt="">MyPlaneStore</a></header>
  <main>
    <p class="product">Temu商家生图skill</p>
    <h1>开通创作账户</h1>
    <p class="lead">图片需求已保留。关联当前 Skill，选套餐扫码后继续创作。</p>
    <form id="registration">
      <label class="consent"><input id="consent" type="checkbox"><span>同意创建创作账户；确认制作后，图片需求和授权照片将发送至生图服务及算力供应商。</span></label>
      <button id="confirm" type="submit" disabled>注册并选套餐 <span aria-hidden="true">→</span></button>
      <p id="feedback" role="status" aria-live="polite">与当前 Skill 自动关联，无需手机号或 API Key。</p>
    </form>
    <p class="continuation">扫码核款到账后，回到原对话即可继续这张图。</p>
  </main>
</body>
</html>
