<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宝宝照片精修照相馆 · 关联账户</title>
<style>*{box-sizing:border-box}body{background:#f5f1e9;color:#283d34;font:16px/1.7 "Microsoft YaHei",sans-serif;margin:0}main{max-width:580px;margin:48px auto;padding:32px;background:#fffcf5;border-radius:20px}h1{font-size:28px}label{display:block;margin:16px 0}input[type=tel],input[type=password]{width:100%;padding:13px;border:1px solid #c6cebf;border-radius:8px;font-size:18px}button,a{display:inline-block;padding:11px 20px;margin:8px 6px 8px 0;border:0;border-radius:10px;background:#466b58;color:white;font-size:16px}aside{padding:16px;background:#ede3d2;border-radius:10px;overflow-wrap:anywhere}small{color:#765f4a}#key{font-family:monospace;font-size:22px}@media(max-width:600px){main{margin:16px;padding:24px}}</style>
<main><small>宝宝的每一个成长瞬间</small><h1>宝宝照片精修照相馆</h1><p>首次填写家长手机号，生成专属随机KEY。已有账户请用原手机号和KEY登录，余额与订单沿用同一账户。</p>
<form id="form"><label>家长手机号<input type="tel" id="phone" autocomplete="tel" maxlength="14" required></label><label>原KEY（已有账户登录时填写）<input type="password" id="password" autocomplete="current-password" maxlength="128"></label>
<label><input type="checkbox" id="accepted"> 我同意将手机号用作账户关联与登录标识，已知无短信验证；照片提交前另行阅读并选择监护人授权。</label>
<p><small>请保存首次生成的KEY。仅凭手机号或尾号不能找回KEY。手机号不用于证明实名或持有权。</small></p>
<button type="submit" id="register">首次建账户</button><button type="button" id="login">已有账户登录</button></form>
<p id="notice" role="status"></p><aside id="result" hidden><strong>账户已关联，请保存随机KEY</strong><p id="key"></p><p>KEY仅本次显示，不要发到聊天中。回到原技能发送“继续”；关联成功不等于已充值到账。</p><a href="/membership/gemini/">我的额度与充值</a></aside></main>
<script>
const el=id=>document.getElementById(id);const entry=new URLSearchParams(location.hash.slice(1)).get('entry');let busy=false;
async function submit(login){if(busy)return;if(!entry||!/^[A-Za-z0-9_-]{43}$/.test(entry)){el('notice').textContent='请从原技能重新打开有效账户入口。';return}if(!el('accepted').checked){el('notice').textContent='请先选择账户关联说明。';return}busy=true;el('register').disabled=el('login').disabled=true;el('notice').textContent='正在关联原账户…';try{const body={entry,phone:el('phone').value,accepted:true};if(login)body.key=el('password').value;const r=await fetch('/platform-api/gemini/album-'+(login?'login':'register'),{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Membership-Request':'1'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw new Error(data.error||'账户关联需要核对');el('password').value='';el('form').hidden=true;el('notice').textContent='已关联同一通用账户，请返回原技能发送“继续”。';el('result').hidden=false;el('key').textContent=data.key_once||'已恢复原账户，KEY保持不变。';history.replaceState(null,'',location.pathname)}catch(e){el('notice').textContent=e.message||'暂时无法关联，请保留原入口重试。'}finally{busy=false;el('register').disabled=el('login').disabled=false}}
el('form').addEventListener('submit',e=>{e.preventDefault();submit(false)});el('login').onclick=()=>submit(true);
</script></html>
