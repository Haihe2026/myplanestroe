limit_req_zone $binary_remote_addr zone=image_pilot:10m rate=2r/s;
server {
    listen 80;
    server_name myplanestore.com www.myplanestore.com;
    location /.well-known/acme-challenge/ { root /var/www/image-assistant; }
    location / { return 301 https://myplanestore.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name myplanestore.com www.myplanestore.com;
    ssl_certificate /etc/letsencrypt/live/myplanestore.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myplanestore.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 32k;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    # Mainland ingress overwrites X-Real-IP; trust only this one owned server.
    set_real_ip_from 43.136.47.247;
    real_ip_header X-Real-IP;
    real_ip_recursive on;
    if ($host = www.myplanestore.com) { return 308 https://myplanestore.com$request_uri; }
    location = / {
        default_type text/html;
        root /var/www/image-assistant/site;
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ^~ /site/ {
        root /var/www/image-assistant;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~ ^/(health|register|activate|balance|presets|jobs(/[^/]+(/image)?)?)$ {
        limit_req zone=image_pilot burst=8 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 220s;
        proxy_send_timeout 20s;
        proxy_connect_timeout 5s;
    }

    location ^~ /temu/ {
        client_max_body_size 16m;
        limit_req zone=image_pilot burst=8 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 220s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 5s;
    }
    location ^~ /membership/listing/ {
        root /var/www/image-assistant;
        index index.html;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; frame-src https://open.weixin.qq.com; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    }
    location /membership/ {
        root /var/www/image-assistant;
        index index.html;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    }
    location /membership-api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Real-IP $remote_addr;
        limit_req zone=image_pilot burst=8 nodelay;
        proxy_read_timeout 30s;
    }
    location = /membership-link {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Real-IP $remote_addr;
        limit_req zone=image_pilot burst=8 nodelay;
    }
    location = /v1/images/generations {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Real-IP $remote_addr;
        limit_req zone=image_pilot burst=8 nodelay;
        limit_req_status 429;
        proxy_read_timeout 220s;
    }
    location = /ops { return 302 /ops/; }
    location = /ops/api/login {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        limit_req zone=image_pilot burst=12 nodelay;
        limit_req_status 429;
        proxy_read_timeout 30s;
    }
    location ^~ /ops/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        limit_req zone=ops_admin_per_ip burst=80 nodelay;
        limit_req_status 429;
        proxy_read_timeout 30s;
    }
    location ^~ /skill-pay/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Real-IP $remote_addr;
        limit_req zone=image_pilot burst=8 nodelay;
        limit_req_status 429;
        proxy_read_timeout 30s;
    }
    location = /jobs {
        client_max_body_size 16m;
        limit_req zone=image_pilot burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 220s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 5s;
    }
    location ^~ /jobs/by-key/ {
        proxy_pass http://127.0.0.1:8787;
        limit_req zone=image_pilot burst=8 nodelay;
        limit_req_status 429;
        proxy_read_timeout 30s;
    }
    location ^~ /quota-pack/gemini/ {
        client_max_body_size 16m;
        limit_req zone=image_pilot burst=8 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18790;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 220s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 5s;
    }
    location = /assistant/register {
        limit_req zone=image_pilot burst=8 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
    location ^~ /skillpay/gemini-tech/ {
        client_max_body_size 64k;
        limit_req zone=image_pilot burst=8 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18791;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 100s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 20s;
    }

    location ^~ /phone-auth/ {
        client_max_body_size 4k;
        limit_req zone=image_pilot burst=6 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location ^~ /auth/wechat/ {
        root /var/www/image-assistant;
        index index.html;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; frame-src https://open.weixin.qq.com; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    }
    location /auth/ {
        root /var/www/image-assistant;
        index index.html;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    }
    # Gemini image request/result streams: avoid nginx body/response temporary files.
    location = /platform-api/gemini/jobs {
        client_max_body_size 16m;
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 240s;
    }
    location = /platform-api/gemini/skill-jobs {
        client_max_body_size 16m;
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 240s;
    }
    location ^~ /platform-api/gemini/jobs/ {
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 240s;
    }
    location ^~ /platform-api/pet/ {
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 120s;
    }
    location ^~ /platform-api/telemetry/ {
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Origin $mps_ops_trusted_origin;
        proxy_read_timeout 8s;
        access_log off;
    }

    location ^~ /platform-api/temu/ {
        client_max_body_size 16m;
        limit_req zone=image_pilot burst=12 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 240s;
    }

    location ^~ /platform-api/ {
        client_max_body_size 16m;
        limit_req zone=image_pilot burst=12 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 240s;
    }

    # trade-leads 0.10.41, additive exact routes
    location = /pay {
        default_type text/html;
        alias /var/www/image-assistant/membership/trade-leads/trade.html;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    }
    location = /link {
        default_type text/html;
        alias /var/www/image-assistant/auth/wechat/redirect.html;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    }
    location ^~ /api/trade-leads/ {
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 150s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        access_log off;
    }
    location ^~ /platform-api/trade-leads/ {
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 150s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        access_log off;
    }
    location = /api/v1/telemetry/skill-trigger {
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2k;
        proxy_read_timeout 5s;
    }
    location / { return 404; }
}
