# MyPlaneStore mainland entry; application and databases remain on the origin.
server {
    listen 80;
    server_name myplanestore.com www.myplanestore.com;
    # WeChat site-ownership re-verification: exact public challenge only.
    location = /7943dd5b041c64ae14da491143cfe887.txt {
        root /www/wwwroot/myplanestore.com;
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    # WeChat site-ownership verification; exact public file only.
    location = /32868b6f16a5a93a47f6c515393d8698.txt {
        root /www/wwwroot/myplanestore.com;
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    # WeChat public-account domain verification: exact file only.
    location = /MP_verify_aB9MziLDF8YDc2an.txt {
        root /www/wwwroot/myplanestore.com;
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    root /www/wwwroot/myplanestore.com;
    location ^~ /.well-known/ { try_files $uri =404; }
    location / { return 308 https://myplanestore.com$request_uri; }
    access_log off;
    error_log /www/wwwlogs/myplanestore.com.error.log;
}

server {
    listen 443 ssl;
    server_name www.myplanestore.com;
    # WeChat site-ownership re-verification: exact public challenge only.
    location = /7943dd5b041c64ae14da491143cfe887.txt {
        root /www/wwwroot/myplanestore.com;
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    # WeChat site-ownership verification; exact public file only.
    location = /32868b6f16a5a93a47f6c515393d8698.txt {
        root /www/wwwroot/myplanestore.com;
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    # WeChat public-account domain verification: exact file only.
    location = /MP_verify_aB9MziLDF8YDc2an.txt {
        root /www/wwwroot/myplanestore.com;
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    ssl_certificate /www/server/panel/vhost/cert/myplanestore.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/myplanestore.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_early_data off;
    location ^~ /.well-known/ {
        root /www/wwwroot/myplanestore.com;
        try_files $uri =404;
    }
    location ~ ^/(?:platform-api/|api/pay/wechat(?:/|$)) {
        proxy_pass https://43.135.143.116;
        proxy_http_version 1.1;
        proxy_set_header Host myplanestore.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_name aistore.zhaopintong.com;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_next_upstream off;
    }
    location / { return 308 https://myplanestore.com$request_uri; }
    access_log off;
}

